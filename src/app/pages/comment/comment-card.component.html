@if (!editing()) {

<div>
  <div class='d-flex justify-content-between'>
    <div>
      <strong>
        {{ comment.user.name }}
      </strong>
      <br>
      <small class='text-muted'>
        {{ comment.createdAt | date:'dd/MM/yyyy HH:mm' }}
      </small>
    </div>
    <div class='d-flex gap-2'>
      @if (canEdit) {
      <button
        class='btn btn-outline-warning btn-sm'
        (click)='edit()'>
        Edit
      </button>
      }
      @if (canDelete) {
      <button
        class='btn btn-outline-danger btn-sm'
        (click)='delete()'>
        Delete
      </button>
      }
    </div>
  </div>
  <p class='mt-3 mb-0'>
    {{ comment.content }}
  </p>
</div>

} @else {

<app-comment-form
  [postId]='postId'
  [comment]='comment'
  (saved)='commentSaved()'
  (cancelled)='cancelEdit()'>
</app-comment-form>

}
