<div class='container-fluid'>
<div class='row'>

  <div class='col-md-6' id='img-bg'></div>

  <div class='col-md-6 mt-5 mb-5'>

    <div class='row d-flex justify-content-center'>
      <div class='col-md-10'>

        <h1 class='text-center'>Cadastro</h1>

        <div class='form-group'>
            <label for='name'>Nome</label>
            <input  
            id='name' 
            type='text' 
            class='form-control' 
            name='name' 
            placeholder='Seu nome'
            [(ngModel)]='request.name'>
        </div>

        <div class='form-group'>
            <label for='email'>E-mail</label>
            <input 
            id='email' 
            type='text' 
            class='form-control' 
            name='email' 
            placeholder='Seu e-mail'
            [(ngModel)]='request.email'>
        </div>

        <div class='form-group'>
            <label for='photo'>Link da foto</label>
            <input 
            id='photo'
            type='text' 
            class='form-control' 
            name='photo' 
            placeholder='Link da sua foto'
            [(ngModel)]='request.photo'>
        </div>

        <div class='form-group'>
            <label for='password'>Senha</label>
            <input  
            id='password'
            type='password' 
            class='form-control'  
            name='password' 
            placeholder='Sua senha'
            [(ngModel)]='request.password'>
        </div>

        <div class='form-group'>
            <label for='confirmPassword'>Confirmar senha</label>
            <input 
            id='confirmPassword' 
            type='password' 
            class='form-control' 
            name='confirmPassword' 
            placeholder='Confirme sua senha'
            [(ngModel)]='confirmPassword'>
        </div>

        <div class='d-flex justify-content-center'>
            <button type='submit' 
            class='btn btn-danger mr-4' 
            routerLink='/entrar'>Cancelar</button>
            
            <button type='submit' 
            class='btn btn-success' 
            (click)='register()'>Cadastrar</button>
        </div>

      </div>
    </div>

  </div>

</div>
</div>
