<div class='mb-3'>
  <textarea
    class='form-control'
    rows='4'
    placeholder='Write your comment...'
    [value]='content()'
    (input)='content.set($any($event.target).value)'>
  </textarea>
</div>

<div class='d-flex gap-2'>
  <button
    class='btn btn-outline-primary'
    [disabled]='saving()'
    (click)='save()'>
    @if (saving()) {
      Saving...
    } @else if (editing) {
      Save
    } @else {
      Comment
    }
  </button>

  @if (editing) {
    <button
      class='btn btn-outline-secondary'
      (click)='cancel()'>
      Cancel
    </button>
  }

</div>
